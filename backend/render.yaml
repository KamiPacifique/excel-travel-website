services:
  - type: web
    name: excel-travel-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set the real value in the Render dashboard, not here.
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        value: special.net1@gmail.com
      - key: MAIL_FROM
        value: Excel Travel & Tours <noreply@send.excel.rw>
      - key: ALLOWED_ORIGINS
        value: https://excel.rw,https://www.excel.rw,https://excel-travel-website.vercel.app
      # Enables strict origin checking (no localhost fallback).
      - key: NODE_ENV
        value: production
